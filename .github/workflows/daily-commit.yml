name: Daily Commit

on:
  schedule:
    # Run at 11:30 PM UTC every day (30 minutes before release workflow)
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
        
      - name: Make dummy change
        run: |
          mkdir -p .daily-updates
          echo "Daily update: ${{ steps.date.outputs.date }} at $(date +'%H:%M:%S')" > .daily-updates/last-update.txt
          echo "Timestamp: $(date -u +%s)" >> .daily-updates/last-update.txt
          echo "Random: $RANDOM" >> .daily-updates/last-update.txt
          
      - name: Commit and push changes
        run: |
          git add .daily-updates/last-update.txt
          git commit -m "Daily update: ${{ steps.date.outputs.date }}"
          git push origin main