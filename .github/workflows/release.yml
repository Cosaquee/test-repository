name: Daily Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Generate version number
        id: version
        run: |
          # Get the latest tag
          git fetch --tags
          LATEST_TAG=$(git tag --sort=-v:refname | head -n 1)

          # Extract major, minor, and patch versions
          IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST_TAG#v}"

          # Generate a random number between 1 and 100
          RANDOM_NUM=$((RANDOM % 100 + 1))

          # Update version based on probabilities
          if [ $RANDOM_NUM -le 10 ]; then
            # 10% chance: Update major version
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ $RANDOM_NUM -le 40 ]; then
            # 30% chance: Update patch version
            PATCH=$((PATCH + 1))
          else
            # 60% chance: Update minor version
            MINOR=$((MINOR + 1))
            PATCH=0
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT

      - name: Create dummy file
        run: echo "This is a dummy file for release ${{ steps.version.outputs.version }}" > release_${{ steps.date.outputs.date }}.txt

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v${{ steps.version.outputs.version }} \
            --title "Release ${{ steps.version.outputs.version }}" \
            --notes "Automated release created on ${{ steps.date.outputs.date }}" \
            ./release_${{ steps.date.outputs.date }}.txt
